{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Hub - Recuperar Senha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/buttons.css' %}">
</head>
    <body>
        <div class="login-container">
            <div class="painel-visual"></div>
            <div class="painel-formulario">
                <div class="card-formulario">
                    <div class="cabecalho-card">
                        <h1>Redefinir sua senha</h1>
                        <p>Informe o e-mail associado à sua conta para receber o link de redefinição.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <label for="email-field" class="rotulo-oculto">Email</label>
                        <div class="campo-forms">
                            <i class="ph ph-envelope icone-campo"></i>
                            <input type="email" id="email-field" placeholder="Seu Email" name="email" required>
                        </div>

                        <button type="submit" class="botao-entrar">Enviar</button>
                    </form>

                    <div class="rodape-card">
                        <p>Lembrou da senha? <a href="{% url 'login' %}" class="link-cadastro">Voltar ao Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
