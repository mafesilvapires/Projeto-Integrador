{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Hub - Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">

    <!-- CSS Modularizado -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/buttons.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/modal.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="painel-visual"></div>
        <div class="painel-formulario">
            <div class="card-formulario">
                <div class="cabecalho-card">
                    <h1>Olá, professor(a)!</h1>
                    <p>Entrar no Teacher Hub</p>
                </div>
                <form action="{% url 'login' %}" method="post" class="credenciais">
                    {% csrf_token %}
                    <div class="campo-forms">
                        <i class="ph ph-user icone-campo"></i>
                        <label for="campo-email" class="rotulo-oculto">Nome de usuário</label>
                        <input type="text" id="campo-email" placeholder="Nome de usuário" name="username" required>
                    </div>
                    <div class="campo-forms">
                        <i class="ph ph-lock-key icone-campo"></i>
                        <label for="campo-senha" class="rotulo-oculto">Senha</label>
                        <input type="password" id="campo-senha" placeholder="Senha" name="senha" required>
                    </div>
                    <div class="botao-esqueci-senha">
                        <a href="{% url 'password_reset' %}" class="link-esqueci-a-senha">Esqueci minha senha</a>
                    </div>
                    
                    <button type="submit" class="botao-entrar">Entrar</button>
                    
                    <div class="rodape-card">
                        <p>Não tem uma conta? <a href="{% url 'cadastro' %}" class="link-cadastro">Inscrever-se</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    {% if messages %}
      {% for message in messages %}
        <script>
          Swal.fire({
            text: '{{ message }}',
            confirmButtonColor: '#0070f3',
            confirmButtonText: 'Tentar novamente'
          });
        </script>
      {% endfor %}
    {% endif %}
</body>
</html>
