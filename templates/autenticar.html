{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Hub - Verificação em Duas Etapas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .grupo-pin {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 24px 0;
        }

        .campo-pin {
            width: 46px;
            height: 52px;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            color: #111827;
            background-color: #f9fafb;
            outline: none;
            transition: all 0.2s ease;
        }

        .campo-pin:focus {
            border-color: #0070f3;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
        }

        .swal2-popup {
            border: none !important;
            border-radius: 20px !important;
        }

        .swal2-confirm {
            border-radius: 50px !important;
            box-shadow: none !important;
            outline: none !important;
        }

        .swal2-confirm:focus {
            box-shadow: none !important;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="painel-visual">
            <!-- Espaço reservado para ilustração -->
        </div>

        <div class="painel-formulario">
            <div class="card-formulario">
                
                <div class="cabecalho-card">
                    <h1>Verificação em duas etapas</h1>
                    <p>Abra seu aplicativo autenticador e insira o código de 6 dígitos.</p>
                </div>

                <form action="#" method="post" class="credenciais" id="form-verificacao">
                    {% csrf_token %}
                    
                    <input type="hidden" name="token_2fa" id="token-2fa">

                    <div class="grupo-pin">
                        <input type="text" maxlength="1" class="campo-pin" placeholder="—" inputmode="numeric" autocomplete="one-time-code" required>
                        <input type="text" maxlength="1" class="campo-pin" placeholder="—" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="campo-pin" placeholder="—" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="campo-pin" placeholder="—" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="campo-pin" placeholder="—" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="campo-pin" placeholder="—" inputmode="numeric" required>
                    </div>

                    <button type="submit" class="botao-entrar">Confirmar</button>

                    <div class="rodape-card">
                        <p>Perdeu acesso ao app? <a href="#" class="link-cadastro">Usar código de recuperação</a></p>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- SweetAlert2 para mensagens de erro vindas do Django -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% if messages %}
      {% for message in messages %}
        <script>
          Swal.fire({
            text: '{{ message }}',
            confirmButtonColor: '#0070f3',
            confirmButtonText: 'Tentar novamente'
          });
        </script>
      {% endfor %}
    {% endif %}

    <script>
        const form = document.getElementById('form-verificacao');
        const pinInputs = document.querySelectorAll('.campo-pin');
        const tokenInput = document.getElementById('token-2fa');

        if (pinInputs.length > 0) {
            pinInputs[0].focus();
        }

        // Monta o token completo antes de submeter
        form.addEventListener('submit', (e) => {
            let token = '';
            pinInputs.forEach(input => token += input.value);
            tokenInput.value = token;

            if (token.length !== 6) {
                e.preventDefault();
                Swal.fire({
                    text: 'Por favor, preencha os 6 dígitos do código.',
                    confirmButtonColor: '#0070f3',
                    confirmButtonText: 'OK'
                });
            }
        });

        pinInputs.forEach((input, index) => {
            // Digitação: aceita somente números e avança automaticamente
            input.addEventListener('input', () => {
                input.value = input.value.replace(/\D/g, '');

                if (input.value && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });

            // Backspace: limpa e retorna ao campo anterior
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });

            // distribui o código nos blocos
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const textoColado = (e.clipboardData || window.clipboardData).getData('text').trim();
                const apenasNumeros = textoColado.replace(/\D/g, '');

                if (apenasNumeros.length > 0) {
                    apenasNumeros.split('').slice(0, pinInputs.length).forEach((digito, i) => {
                        pinInputs[i].value = digito;
                    });

                    const proximoFoco = Math.min(apenasNumeros.length, pinInputs.length - 1);
                    pinInputs[proximoFoco].focus();
                }
            });
        });
    </script>
</body>
</html>
