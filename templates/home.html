{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Hub - Painel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/home.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <span>Teacher Hub</span>
        </div>
        <div class="topbar-user">
            <i class="ph ph-user-circle"></i>
            <span>{{ user.username }}</span>
        </div>
    </header>

    <div class="layout-body">
        <aside class="sidebar">
            <nav class="sidebar-conteudo">
                <ul class="nav-lista">
                    <li>
                        <a href="{% url 'plataforma' %}" class="nav-item ativo">
                            <i class="ph ph-squares-four icone-nav"></i>
                            <span>Início</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'compliance:compliance_home' %}" class="nav-item">
                            <i class="ph ph-shield-check icone-nav"></i>
                            <span>Privacidade e Dados</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-rodape">
                <form action="{% url 'logout' %}" method="post" class="form-logout">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">
                        <i class="ph ph-sign-out icone-logout"></i>
                        <span>Fazer Log Out</span>
                    </button>
                </form>
            </div>
        </aside>

        <main class="main-content">
            <div class="card-boas-vindas">
                <h1>Área Autenticada</h1>
                <p class="saudacao">Olá, <strong>{{ user.username }}</strong></p>
                <p class="status-autenticado">Sessão iniciada com sucesso na plataforma.</p>
            </div>
        </main>
    </div>
</body>
</html>
