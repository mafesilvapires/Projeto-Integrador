
name: Esteira DevSecOps Avançada

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  bearer-scan:
    name: Bearer (SAST e dados sensíveis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Bearer CLI
        uses: bearer/bearer-action@v2
        with:
          severity: critical,high,medium

  zap-dast:
    name: OWASP ZAP (DAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir aplicação Django e MySQL
        run: docker compose up -d --build

      - name: Aguardar aplicação ficar disponível
        run: |
          echo "Aguardando Django iniciar..."

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "Django funcional"
              exit 0
            fi

            echo "Aguardando inicialização..."
            sleep 5
          done

          echo "Erro: Django não iniciou a tempo."
          docker compose logs
          exit 1

      - name: Executar OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:8000'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a'

      - name: Encerrar containers
        if: always()
        run: docker compose down


  trivy-sbom:
    name: Trivy - Supply Chain Security
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Gerar SBOM do codigo-fonte
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-source.json

      - name: Construir imagem Docker
        run: docker build -t teacher-hub:local .

      - name: Gerar SBOM da imagem Docker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: teacher-hub:local
          format: cyclonedx
          output: sbom-image.json
        
      - name: Analisar vulnerabilidades do código-fonte
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Analisar vulnerabilidades da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: teacher-hub:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload dos SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            sbom-source.json
            sbom-image.json
          if-no-files-found: error
          retention-days: 30
